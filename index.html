<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Signup</title>
</head>

<body>
    <div class="content">
        <div class="left">
            <img src="halie-west.jpg" alt="Nature.png">
            <div class="logo">
                <img src="odin-lined.png" alt="odinlogo.png">
            </div>
        </div>

        <div class="right">
            <div class="topright">
                <p>This is not a real website, you guys obviously know that. I don't even know what to write here.</p>
                <br>
                <p>I seriously don't know, maybe you guys do.</p>
            </div>
            <div class="form">
                <form action="" method="">

                    <fieldset>
                        <label for="first_name">First Name:</label>
                        <input type="text" id="first_name" name="first_name">

                        <label for="last_name">Last Name:</label>
                        <input type="text" id="last_name" name="last_name">

                    </fieldset>

                    <fieldset>
                        <label for="user_email">Email Address:</label>
                        <input type="email" id="user_email" name="email" placeholder="you@example.com">

                        <label for="phone_number">Phone No</label>
                        <input type="number" id="phone_numbeer" name="phone_numbeer">
                    </fieldset>

                    <fieldset>
                        <label for="user_password">Password:</label>
                        <input type="password" id="user_password" name="password">

                        <label for="confirm_password">Confirm Password:</label>
                        <input type="password" id="confirm_password" name="confirm_password">
                    </fieldset>
                    <button type="submit">Create Account</button>
                </form>

                <p>Already have an account? <a href="">Log in</a></p>
            </div>
        </div>
    </div>
</body>

</html>
